name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

# Supersede in-flight runs for the same ref instead of running every one to
# completion. Pushing a short series of commits (or amending a PR) used to start
# a full matrix per push and finish all of them, so a five-commit series cost
# five complete runs and only the last result was ever looked at. On a public
# repo the minutes are free, but the queue is not and neither is the reviewer's
# attention — and on any private repo this is the single largest source of
# wasted Actions minutes.
#
# `main` is deliberately EXCLUDED from cancellation: a push to main is a release
# signal and its run must complete even if another push follows.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: |
          cd mobile
          npm ci

      - name: Validate Expo project (expo-doctor)
        run: |
          cd mobile
          npx --yes expo-doctor

      - name: Metro bundle (android, JS only)
        run: |
          cd mobile
          npx expo export --platform android --output-dir .expo-export
        env:
          CI: true
