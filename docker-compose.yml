version: '3.8'

# DEV: runs Postgres only.
# Start with: docker compose up -d
# Run backend/frontend locally with: npm run dev

services:
  database:
    image: postgres:15
    container_name: tax_advisor_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tax_advisor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      # Bound to the loopback interface ON PURPOSE. A bare "5432:5432" publishes
      # on 0.0.0.0, and docker's iptables rules are inserted ahead of ufw — so
      # the DB ends up reachable from the internet even though ufw says the port
      # is closed. That has already cost one production outage and left a
      # production-data clone exposed on staging for ~3 weeks.
      #
      # The server-local, untracked docker-compose.override.yml also pins this
      # (prod 127.0.0.1:5432, staging 127.0.0.1:5433). That override must remain
      # an ergonomics choice, never the only thing standing between the database
      # and the public internet — which is what this line is for.
      # The host PORT is env-tunable (staging uses 5433 alongside prod's 5432 on
      # the same box); the host INTERFACE is hardcoded and deliberately is not.
      #
      # Compose merges `ports` by APPENDING, it does not replace — which is
      # precisely why the override never protected anything: the tracked
      # 0.0.0.0 binding survived alongside it. Set DB_HOST_PORT in .env rather
      # than adding a second ports entry in an override file.
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init order matches docker-entrypoint-initdb.d (lex sort):
      # 01-schema.sql creates the canonical schema; the corrective migrations
      # in backend/database/migrations/ are NOT auto-applied here — for a fresh
      # dev DB run them manually after first boot (see README/AGENTS.md).
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: tax_advisor_network